<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" fill="none">
  <!-- Background -->
  <rect width="1000" height="1000" fill="#FAF9F6"/>
  
  <!-- Subtle Decorative Border -->
  <rect x="20" y="20" width="960" height="960" rx="40" stroke="#E5DCEB" stroke-width="8" fill="none"/>
  <rect x="40" y="40" width="920" height="920" rx="32" stroke="#80608E" stroke-width="2" stroke-dasharray="8 8" opacity="0.3" fill="none"/>

  <!-- Centered Icon Container -->
  <g transform="translate(380, 380)">
    <!-- Circle Background -->
    <circle cx="120" cy="120" r="110" fill="#F3EDF5" stroke="#D8CDE0" stroke-width="4"/>
    
    <!-- Elegant Package / Sparkle Icon -->
    <path d="M70 100 L120 75 L170 100 L120 125 Z" stroke="#80608E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M70 100 V150 L120 175 V125" stroke="#80608E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M170 100 V150 L120 175" stroke="#80608E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M120 75 V125" stroke="#80608E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Watermark Text -->
  <text x="500" y="680" font-family="serif" font-size="28" font-weight="600" fill="#80608E" text-anchor="middle" letter-spacing="6" opacity="0.7">
    NOLA STORE
  </text>
</svg>
